<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIMURA — style lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #F3ECD8; font: 13px/1.4 ui-rounded, "SF Pro Rounded", ui-sans-serif, system-ui, sans-serif; }
    #lab { position: fixed; inset: 0; }
    #lab canvas { display: block; }
    #tag { position: fixed; top: 14px; left: 16px; background: rgba(252,248,238,.85); color: #3A3B33;
      border: 1px solid rgba(255,255,255,.6); border-radius: 14px; padding: 8px 14px;
      box-shadow: 0 10px 26px rgba(122,101,62,.18); }
    #tag b { letter-spacing: .14em; }
    #tag small { color: #8B8674; display: block; }
  </style>
</head>
<body>
  <div id="lab"></div>
  <div id="tag"><b>STYLE LAB</b><small>drag orbit · wheel zoom · 1/2/3 cameras</small>
    <div id="ctl" style="display:flex;gap:6px;margin-top:7px;">
      <button id="ctl-time">☀ noon</button>
      <button id="ctl-weather">◌ clear</button>
      <button id="ctl-season">✿ summer</button>
    </div>
  </div>
  <style>
    #ctl button { background:#fffdf6; border:1px solid rgba(90,78,52,.25); border-radius:10px;
      padding:4px 10px; font:12px/1.3 inherit; color:#3A3B33; cursor:pointer; box-shadow:0 3px 8px rgba(122,101,62,.15); }
    #ctl button:hover { background:#fff; }
  </style>
  <script type="module" src="./style-lab.ts"></script>
</body>
</html>
